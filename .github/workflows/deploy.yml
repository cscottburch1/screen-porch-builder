name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install rsync and sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy to Hostinger via SFTP
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sshpass -e rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='.claude' \
            --exclude='README.md' \
            --exclude='FORM_SETUP.md' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:${{ secrets.FTP_SERVER_DIR }}"
